{label:'🌈 웃는 무지개',art:()=>p('M134 292 A156 156 0 0 1 446 292 L414 292 A124 124 0 0 0 166 292 Z')+p('M166 292 A124 124 0 0 1 414 292 L382 292 A92 92 0 0 0 198 292 Z')+p('M198 292 A92 92 0 0 1 382 292 L350 292 A60 60 0 0 0 230 292 Z')+cloud(151,302)+cloud(436,302)+`<g transform="translate(50 193) scale(.35)">${face(294,290)}</g><g transform="translate(335 193) scale(.35)">${face(294,290)}</g>`+star(106,110)+star(475,149)+heart(290,84,.65)},

let scene=0,color='#ff88b5',history=[],records={};try{records=JSON.parse(localStorage.getItem('sparkle-color-v1')||'{}')||{};}catch{}const drawing=document.querySelector('#drawing'),status=document.querySelector('#status');
function persist(){try{localStorage.setItem('sparkle-color-v1',JSON.stringify(records));}catch{}}
function shapes(){return [...drawing.querySelectorAll('[data-paint]')];}
function remember(){history.push(shapes().map(n=>n.getAttribute('fill')));if(history.length>60)history.shift();}
function commit(){records[scene]=shapes().map(n=>n.getAttribute('fill'));persist();document.querySelector('#undo').disabled=!history.length;}
function paint(n){remember();n.setAttribute('fill',color);commit();status.textContent=['예쁜 색이 쏙! 🌈','내가 만든 멋진 그림! ✨','알록달록, 정말 예뻐요! 🌷'][Math.floor(Math.random()*3)];const spark=document.querySelector('#spark');spark.classList.remove('pop');void spark.offsetWidth;spark.classList.add('pop');}
function render(){drawing.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410" role="group" aria-label="${scenes[scene].label} 색칠 도안"><rect width="580" height="410" fill="white"/><g fill="white" stroke="${outline}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">${scenes[scene].art()}</g></svg>`;shapes().forEach((n,i)=>{n.setAttribute('fill',records[scene]?.[i]||'#ffffff');n.setAttribute('tabindex','0');n.setAttribute('role','button');n.setAttribute('aria-label',`색칠 영역 ${i+1}`);n.addEventListener('click',()=>paint(n));n.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();paint(n);}});});history=[];document.querySelector('#undo').disabled=true;document.querySelectorAll('.character').forEach((b,i)=>b.setAttribute('aria-pressed',i===scene));}
scenes.forEach((s,i)=>{const b=document.createElement('button');b.className='character';b.textContent=s.label;b.onclick=()=>{scene=i;render();status.textContent='색을 고르고 그림을 톡 눌러요!';};document.querySelector('.characters').append(b);});
[['분홍','#ff88b5'],['빨강','#f45262'],['주황','#ffac62'],['노랑','#ffe16c'],['연두','#b6df74'],['민트','#73d9bd'],['하늘','#7ccafa'],['파랑','#6992eb'],['보라','#bb96eb'],['갈색','#be947c'],['회색','#a7a8b6'],['흰색','#ffffff']].forEach(([name,hex],i)=>{const b=document.createElement('button');b.className='swatch';b.style.background=hex;b.setAttribute('aria-label',name+(name==='흰색'?' 지우개':''));b.setAttribute('aria-pressed',i===0);b.onclick=()=>{color=hex;document.querySelectorAll('.swatch').forEach(n=>n.setAttribute('aria-pressed',n===b));status.textContent=name==='흰색'?'지우고 싶은 곳을 톡 눌러요. 🫧':`${name}을 골랐어요! 그림을 톡!`;};document.querySelector('.palette').append(b);});
document.querySelector('#undo').onclick=()=>{const previous=history.pop();if(previous){shapes().forEach((n,i)=>n.setAttribute('fill',previous[i]));commit();status.textContent='한 번 뒤로 돌아왔어요. ↩️';}};
const dialog=document.querySelector('#confirm');document.querySelector('#reset').onclick=()=>dialog.showModal();document.querySelector('#cancel').onclick=()=>dialog.close();document.querySelector('#clear').onclick=()=>{remember();shapes().forEach(n=>n.setAttribute('fill','#ffffff'));commit();dialog.close();status.textContent='새롭게 색칠해 봐요! 🫧';};
document.querySelector('#save').onclick=()=>{const svg=drawing.querySelector('svg').cloneNode(true);svg.querySelectorAll('[tabindex]').forEach(n=>n.removeAttribute('tabindex'));const blob=new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=1740;c.height=1230;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>{if(!b){status.textContent='저장이 되지 않았어요. 다시 눌러 주세요.';return;}const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='나의_반짝반짝_색칠그림.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);status.textContent='그림 저장을 요청했어요! 다운로드를 확인해 주세요. 🖼️';},'image/png');};img.onerror=()=>{URL.revokeObjectURL(url);status.textContent='이 브라우저에서는 저장이 어려워요. 화면 캡처로 간직해 주세요.';};img.src=url;};render();
